name: Deploy MP Qukis to GitHub Pages

# Deploy statis: setiap push ke main, isi repo (index.html + assets/ + CNAME)
# langsung di-publish ke GitHub Pages. Tidak ada build step karena artifact
# sudah berupa bundle jadi. Kalau nanti dashboard punya source + build sendiri,
# tambahkan step build di job "build" sebelum upload-pages-artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Batalkan run lama kalau ada push baru, biar cuma versi terakhir yang live.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish seluruh root repo apa adanya (static site).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
